kind: 'Added'
body: 'added `LD_PRELOAD` parking to `termux-etc-mount`: immediately before `execve` the value is copied to `TERMUX_ETC_LD_PRELOAD` and removed, on the supervised path and on the reentrancy short-circuit alike. A musl loader treats a bionic preload entry it cannot relocate as fatal -- `Error relocating ...: symbol not found`, before `main()` -- so Claude Code''s wrapper used to `unset LD_PRELOAD`, which also stripped `termux-exec` from every bionic process Claude spawned: the shell behind each tool call, `make`, and their scripts, so every `#!/usr/bin/env` script failed with exit 127 under Claude while working from a plain Termux tab. Parking keeps both halves: the musl target starts clean, and a bionic descendant restores the shims from the parked copy in its shell rc file (`[ -z "$LD_PRELOAD" ] && [ -n "$TERMUX_ETC_LD_PRELOAD" ] && export LD_PRELOAD="$TERMUX_ETC_LD_PRELOAD"`). `test/test-mount.c` asserts the target never sees `LD_PRELOAD`, `make test` sets it to the Tier 1 library so the assertion is exercised, and a second check proves the parked value reaches a bionic child intact. The README, `examples/claude-code.md` and `CLAUDE.md` document the contract.'
time: '2026-09-03T18:31:56.399015915Z'
